[project]
name = "graphify-finding-hub"
version = "0.1.0"
description = "Tenant-aware, self-hosted findings registry with optional Jira and billing"
requires-python = ">=3.12,<3.14"
license = "AGPL-3.0-only"
authors = [{name = "De Jonckheere Stéphane (humblejok)"}]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
