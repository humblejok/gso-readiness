services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hub
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - hub-postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U hub -d hub]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  worker:
    build: .
    env_file: .env
    command: [python, manage.py, process_delivery_outbox]
    depends_on:
      db:
        condition: service_healthy
volumes:
  hub-postgres:
