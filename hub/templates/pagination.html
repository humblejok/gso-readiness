<nav class="pagination" aria-label="Pagination">{% if rows.has_previous %}<a href="?page={{ rows.previous_page_number }}&q={{ request.GET.q|urlencode }}&severity={{ request.GET.severity|urlencode }}&lifecycle={{ request.GET.lifecycle|urlencode }}">Previous</a>{% endif %}<span class="muted">Page {{ rows.number }} of {{ rows.paginator.num_pages }}</span>{% if rows.has_next %}<a href="?page={{ rows.next_page_number }}&q={{ request.GET.q|urlencode }}&severity={{ request.GET.severity|urlencode }}&lifecycle={{ request.GET.lifecycle|urlencode }}">Next</a>{% endif %}</nav>
